<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <nav>
            <div>
                <img width="54px" src="assets/images/logo.svg" alt="">
            </div>
            <div class="buttons">
                <select name="language">
                    <option value="english">English</option>
                    <option value="hindi">हिंदी</option>
                </select>
                <button>Sign In</button>
            </div>
        </nav>
        <div class="box"></div>
        <div class="tagline">
            <span>Plot twist: New hits, every single week</span>
            <span>Starts at ₹149. Cancel at any time.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>
            <div class="buttons2">
                <input type="text" placeholder="Email Address">
                <button>Get Started <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 4l8 8-8 8" />
                    </svg></button>
            </div>
        </div>
    </div>
    <section class="trending">
        <h2>Trending Now</h2>
        <div class="cards">

        </div>
    </section>
</body>

</html>
