<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Class</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="FirstDiv" class="red yellow">First</div>
    <!-- id attribute to give a unique identifier -->
    <div id="SecondDiv" class="yellow">Second</div>
    <!-- class attribute to group some tags, multiple classes allowed -->
    <span class="red"></span>
</body>
</html>
