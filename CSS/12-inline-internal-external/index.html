<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline, Internal and External CSS</title>
    <style>
        /* this is using internal CSS */
        h2{
            background-color: red;
            color: yellow;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="background-color: green;color: blue;">Types for adding CSS to HTML</h1>
    <!-- this using inline CSS -->
    <h2>Types for adding CSS to HTML</h2>
    <h3>Types for adding CSS to HTML</h3>
    <ol>
        <li>Inline CSS</li>
        <li>Internal CSS</li>
        <li>External CSS</li>
    </ol>
</body>
</html>
