<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing Post/Put Request</title>
</head>
<body>
    <script>
        async function testPost(){
            let post=await fetch("http://localhost:3000/",{method:"POST"})
            console.log(await post.text())
            let put=await fetch("http://localhost:3000/",{method:"PUT"})
            console.log(await put.text())
        }
        testPost()
    </script>
</body>
</html>
