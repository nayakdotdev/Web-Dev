<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        /* using CSS to style */
        div, span{
            /* these are called selectors [div,span] */
            color: brown;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <div>Hello guys.. Let's CSS!</div>
    <div>I am CSS</div>
    <span>Span here</span>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nisi animi maiores assumenda veritatis error, et omnis voluptatum doloribus non? Repellat officiis quidem a!</p>
</body>
</html>
